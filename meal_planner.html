<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Meal Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --surface2: #F2EFE9;
  --border: #E4E0D8;
  --border2: #D4CFC5;
  --text: #1C1A17;
  --text2: #6B6760;
  --text3: #9E9B96;
  --accent: #2D5A3D;
  --accent-light: #EAF2EC;
  --accent-border: #B8D4BE;
  --warn: #B45309;
  --warn-light: #FEF3C7;
  --warn-border: #FCD34D;
  --danger: #9B1C1C;
  --danger-light: #FEF2F2;
  --tg: #0A5C8A;
  --tg-light: #E3F4FB;
  --tg-border: #74BCE8;
  --wa: #0E6832;
  --wa-light: #E4F7EA;
  --wa-border: #6DC98D;
  --protein: #C4712A;
  --protein-bg: #FDF0E8;
  --veg: #2D7A3F;
  --veg-bg: #EDF7ED;
  --soup: #1B6B85;
  --soup-bg: #EFF8FA;
  --fruit: #7C3A8E;
  --fruit-bg: #F5EEF8;
  --carbs: #7A5C1E;
  --carbs-bg: #FEF9EE;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Top bar ── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 50;
  gap: 12px;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.app-title {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.week-nav { display: flex; align-items: center; gap: 2px; }
.nav-btn {
  width: 28px; height: 28px;
  border: 1px solid var(--border);
  background: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text2);
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.nav-btn:hover { background: var(--surface2); color: var(--text); }
.week-label {
  font-size: 12px;
  color: var(--text2);
  min-width: 120px;
  text-align: center;
  font-weight: 500;
}
.topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 6px 14px;
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  cursor: pointer;
  color: var(--text);
  transition: all .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface2); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-accent:hover { background: #234d33; }
.btn-tg { background: var(--tg-light); border-color: var(--tg-border); color: var(--tg); }
.btn-tg:hover { background: #d0ecf8; }
.btn-wa { background: var(--wa-light); border-color: var(--wa-border); color: var(--wa); }
.btn-wa:hover { background: #d0f0db; }
.btn-purple { background: #F3EEF8; border-color: #C0A0D8; color: #5A2880; }
.btn-purple:hover { background: #EAE3F3; }
.btn-danger { background: var(--danger-light); border-color: #FCA5A5; color: var(--danger); }
.btn-danger:hover { background: #FEE2E2; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-ghost { background: none; border-color: transparent; color: var(--text2); }
.btn-ghost:hover { background: var(--surface2); border-color: var(--border); }

/* ── Main layout ── */
.main { padding: 20px 24px 100px; max-width: 1200px; margin: 0 auto; }

/* ── Plan table ── */
.plan-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.plan-table { width: 100%; border-collapse: collapse; }
.plan-table thead th {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .06em;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  text-align: left;
}
.plan-table thead th:not(:last-child) { border-right: 1px solid var(--border); }
.col-day { width: 100px; }

.plan-table tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
.plan-table tbody td:not(:last-child) { border-right: 1px solid var(--border); }

.td-day {
  padding: 14px;
  vertical-align: top;
  background: var(--surface2);
}
.day-name { font-size: 14px; font-weight: 600; color: var(--text); }
.day-date { font-size: 11px; color: var(--text3); margin-top: 2px; }
.wknd-badge {
  display: inline-block;
  margin-top: 6px;
  font-size: 10px;
  font-weight: 600;
  color: var(--warn);
  background: var(--warn-light);
  border: 1px solid var(--warn-border);
  border-radius: 20px;
  padding: 1px 7px;
}

.td-meal { padding: 12px 14px; vertical-align: top; }

.meal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.meal-lbl {
  font-size: 10px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.out-toggle {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: none;
  cursor: pointer;
  color: var(--text3);
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  transition: all .15s;
}
.out-toggle:hover { background: var(--surface2); color: var(--text2); }
.out-toggle.active { background: var(--warn-light); border-color: var(--warn-border); color: var(--warn); }

.out-state {
  font-size: 12px;
  color: var(--warn);
  padding: 6px 0 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Dish rows ── */
.dish {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 7px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .12s;
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.dish:hover { background: var(--surface2); border-color: var(--border); }
.dish-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 5px;
}
.dish-info { flex: 1; min-width: 0; }
.dish-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
.dish-ing {
  font-size: 11px;
  color: var(--text2);
  line-height: 1.4;
  margin-top: 1px;
}
.dish-edit-icon {
  font-size: 11px;
  color: var(--text3);
  opacity: 0;
  transition: opacity .12s;
  flex-shrink: 0;
  margin-top: 3px;
}
.dish:hover .dish-edit-icon { opacity: 1; }

.add-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text3);
  background: none;
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  padding: 4px 8px;
  cursor: pointer;
  width: 100%;
  font-family: 'DM Sans', sans-serif;
  margin-top: 4px;
  transition: all .15s;
}
.add-btn:hover { color: var(--text2); background: var(--surface2); border-color: var(--border2); }

/* Type colours */
.protein-dot { background: var(--protein); }
.veg-dot { background: var(--veg); }
.soup-dot { background: var(--soup); }
.fruit-dot { background: var(--fruit); }
.carbs-dot { background: var(--carbs); }


/* ── Mobile layout (phones) ────────────────────────────── */
/* Mobile cards hidden by default — shown only on small screens */
.mobile-plan { display: none; }

@media (max-width: 700px) {
  .topbar { padding: 0 14px; height: auto; min-height: 52px; flex-wrap: wrap; gap: 8px; padding-top: 10px; padding-bottom: 10px; }
  .app-title { font-size: 16px; }
  .week-label { min-width: 90px; font-size: 11px; }
  .topbar-right { gap: 6px; }
  .btn { padding: 5px 10px; font-size: 12px; }
  .main { padding: 12px 12px 100px; }

  /* Hide table entirely on mobile */
  .plan-wrap { display: none; }

  /* Show mobile cards instead */
  .mobile-plan { display: flex; flex-direction: column; gap: 10px; }

  .day-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .day-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .day-card-left { display: flex; align-items: center; gap: 10px; }
  .day-card-name { font-size: 15px; font-weight: 600; }
  .day-card-date { font-size: 12px; color: var(--text3); }

  .meal-block { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .meal-block:last-child { border-bottom: none; }
  .meal-block-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .meal-block-label {
    font-size: 11px; font-weight: 600; color: var(--text3);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .send-bar { padding: 10px 14px; }
  .send-bar-text { display: none; }
}



/* ── Send bar ── */
.send-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 40;
  box-shadow: 0 -4px 16px rgba(0,0,0,.06);
}
.send-bar-text { font-size: 13px; color: var(--text2); }
.send-bar-text strong { color: var(--text); }
.send-bar-actions { display: flex; gap: 8px; }

/* ── Modal overlay ── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(28,26,23,.45);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(2px);
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  padding: 24px;
  width: 440px;
  max-width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp .2s ease;
}
@keyframes slideUp {
  from { transform: translateY(12px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-title {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  margin-bottom: 20px;
  color: var(--text);
}
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 5px;
}
.field select, .field input[type=text] {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--surface);
  transition: border .15s;
  appearance: auto;
}
.field select:focus, .field input[type=text]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.ing-hint {
  margin-top: 8px;
  padding: 9px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--text2);
  line-height: 1.6;
  display: none;
}
.ing-hint strong { color: var(--text); }
.type-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.type-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all .12s;
  font-family: 'DM Sans', sans-serif;
}
.type-badge.protein { background: var(--protein-bg); color: var(--protein); border-color: #E8AA70; }
.type-badge.veg     { background: var(--veg-bg);     color: var(--veg);     border-color: #88C888; }
.type-badge.soup    { background: var(--soup-bg);    color: var(--soup);    border-color: #90CCE0; }
.type-badge.fruit   { background: var(--fruit-bg);   color: var(--fruit);   border-color: #CC88DD; }
.type-badge.carbs   { background: var(--carbs-bg);   color: var(--carbs);   border-color: #C8B080; }
.type-badge.selected { outline: 2.5px solid currentColor; outline-offset: 1px; }
.modal-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.modal-footer-right { display: flex; gap: 8px; }

/* ── Grocery modal ── */
.groc-modal { width: 520px; }
.groc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
.groc-section h4 {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
}
.groc-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text);
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.groc-item:last-child { border-bottom: none; }
.groc-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.groc-empty { font-size: 12px; color: var(--text3); padding: 8px 0; font-style: italic; }

/* ── Share modal ── */
.share-ta {
  width: 100%;
  height: 200px;
  padding: 12px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface2);
  color: var(--text);
  resize: none;
  margin-top: 12px;
  line-height: 1.6;
}
.share-hint {
  font-size: 12px;
  color: var(--text2);
  margin-top: 10px;
  line-height: 1.6;
}
</style>
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <div class="topbar-left">
    <div class="app-title">🍱 Family Meal Planner</div>
    <div class="week-nav">
      <button class="nav-btn" onclick="changeWeek(-1)">&#8249;</button>
      <span class="week-label" id="week-label"></span>
      <button class="nav-btn" onclick="changeWeek(1)">&#8250;</button>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn" onclick="regenerate()">↺ Regenerate</button>
    <button class="btn btn-purple" onclick="showGrocery()">🛒 Grocery list</button>
    <button class="btn btn-tg" onclick="shareVia('telegram')">✈ Telegram</button>
    <button class="btn btn-wa" onclick="shareVia('whatsapp')">💬 WhatsApp</button>
  </div>
</header>

<!-- Main -->
<main class="main">
  <div class="plan-wrap">
    <table class="plan-table">
      <thead>
        <tr>
          <th class="col-day">Day</th>
          <th>🌅 Breakfast</th>
          <th>☀️ Lunch</th>
          <th>🌙 Dinner</th>
        </tr>
      </thead>
      <tbody id="plan-body"></tbody>
    </table>
  </div>
  <!-- Mobile card layout -->
  <div class="mobile-plan" id="mobile-plan"></div>
</main>

<!-- Send bar -->
<div class="send-bar">
  <p class="send-bar-text"><strong>Happy with the plan?</strong> Send to your family and helper.</p>
  <div class="send-bar-actions">
    <button class="btn btn-tg" onclick="shareVia('telegram')">✈ Send via Telegram</button>
    <button class="btn btn-wa" onclick="shareVia('whatsapp')">💬 Send via WhatsApp</button>
  </div>
</div>

<!-- Edit / Add Dish Modal -->
<div class="overlay" id="dish-overlay">
  <div class="modal">
    <div class="modal-title" id="dish-modal-title">Edit dish</div>

    <div class="field">
      <label>Day</label>
      <select id="m-day"></select>
    </div>
    <div class="field">
      <label>Meal</label>
      <select id="m-meal" onchange="onMealChange()">
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
      </select>
    </div>
    <div class="field">
      <label>Type</label>
      <div class="type-badges">
        <button class="type-badge protein" onclick="selectType('protein')">🥩 Protein</button>
        <button class="type-badge veg"     onclick="selectType('veg')">🥦 Vegetable</button>
        <button class="type-badge soup"    onclick="selectType('soup')">🍲 Soup</button>
        <button class="type-badge fruit"   onclick="selectType('fruit')">🍎 Fruit</button>
        <button class="type-badge carbs"   onclick="selectType('carbs')">🌾 Carbs</button>
      </div>
      <input type="hidden" id="m-type" value="protein">
    </div>
    <div class="field">
      <label>Recipe</label>
      <select id="m-recipe" onchange="onRecipePick()">
        <option value="">— select a recipe or type custom below —</option>
      </select>
      <div class="ing-hint" id="ing-hint"></div>
    </div>
    <div class="field">
      <label>Dish name &amp; ingredients (editable)</label>
      <input type="text" id="m-name" placeholder="e.g. Spinach - Spinach + Carrot + Mushrooms">
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="delete-btn" onclick="deleteDish()">🗑 Remove dish</button>
      <div class="modal-footer-right">
        <button class="btn btn-ghost" onclick="closeOverlay('dish-overlay')">Cancel</button>
        <button class="btn btn-accent" onclick="saveDish()">Save dish</button>
      </div>
    </div>
  </div>
</div>

<!-- Grocery Modal -->
<div class="overlay" id="groc-overlay">
  <div class="modal groc-modal">
    <div class="modal-title">🛒 Grocery list</div>
    <p style="font-size:12px;color:var(--text2)">Split by shopping day. Dining-out meals are excluded.</p>
    <div class="groc-cols" id="groc-cols"></div>
    <div class="modal-footer">
      <div></div>
      <div class="modal-footer-right">
        <button class="btn btn-ghost" onclick="closeOverlay('groc-overlay')">Close</button>
        <button class="btn btn-tg" onclick="sendGrocery('telegram')">✈ Send via Telegram</button>
        <button class="btn btn-wa" onclick="sendGrocery('whatsapp')">💬 Send via WhatsApp</button>
      </div>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div class="overlay" id="share-overlay">
  <div class="modal" style="width:480px">
    <div class="modal-title" id="share-title"></div>
    <textarea class="share-ta" id="share-text" readonly></textarea>
    <p class="share-hint" id="share-hint"></p>
    <div class="modal-footer">
      <div></div>
      <div class="modal-footer-right">
        <button class="btn btn-ghost" onclick="closeOverlay('share-overlay')">Close</button>
        <button class="btn" id="share-open-btn" onclick="doShare()">Open app ↗</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const IS_WE = {Saturday:true,Sunday:true};

const REC = {
  protein:[
    {name:'Soy sauce Chicken',    ing:['Chicken Thighs']},
    {name:'Herbal Chicken',       ing:['Chicken Thighs','Goji berries','Red date']},
    {name:'Chicken Breast',       ing:['Chicken Breast','Ginger']},
    {name:'Tofu Minced Pork',     ing:['Minced Pork','Soft Tofu']},
    {name:'Tofu egg',             ing:['Hard Tofu','Eggs']},
    {name:'Salmon egg',           ing:['Salmon','Eggs']},
    {name:'Tuna Egg',             ing:['Tuna','Eggs']},
    {name:'Sardine',              ing:['Sardine','Tomato']},
    {name:'Steamed Salmon',       ing:['Salmon']},
    {name:'Chicken drumstick',    ing:['Chicken drumstick','Ginger']},
  ],
  veg:[
    {name:'Spinach',              ing:['Spinach','Carrot','Mushrooms']},
    {name:'Green Dragon Veg',     ing:['Green Dragon Veg','Beansprout','Ikan Bilis']},
    {name:'Bamboo shoot',         ing:['Bamboo shoot','Carrot','Mushrooms']},
    {name:'Chye sim',             ing:['Chye sim','Carrot','Mushrooms']},
    {name:'Kai Lan',              ing:['Kai Lan','Carrot','Mushrooms']},
    {name:'Lady finger',          ing:['Lady finger','Carrot','Mushrooms']},

const TYPE_DOT = {protein:'protein-dot',veg:'veg-dot',soup:'soup-dot',fruit:'fruit-dot',carbs:'carbs-dot'};
const DOT_COLOR = {protein:'var(--protein)',veg:'var(--veg)',soup:'var(--soup)',fruit:'var(--fruit)',carbs:'var(--carbs)'};
const ING_CAT = {
  'Pork Ribs':'protein','Chicken Thighs':'protein','Chicken Breast':'protein','Chicken drumstick':'protein',
  'Minced Pork':'protein','Salmon':'protein','Tuna':'protein','Sardine':'protein',
  'Fish bone':'protein','Chicken bone':'protein','Hard Tofu':'protein','Soft Tofu':'protein','Eggs':'protein',
  'Carrot':'veg','Mushrooms':'veg','Spinach':'veg','Brocoli':'veg','Kai Lan':'veg','Chye sim':'veg',
  'Lady finger':'veg','Bamboo shoot':'veg','Zucchini/cucumber':'veg','Green Dragon Veg':'veg',
  'Beansprout':'veg','Tomato':'veg','Corn':'veg','Winter melon':'veg','Old cucumber':'veg',
  'Lotus root':'veg','Ikan Bilis':'veg','Ginger':'veg','Goji berries':'veg','Red date':'veg',
  'Black bean':'soup','Si Shen Herbs':'soup','Liu Wei Herbs':'soup','Dun Ji Tang Herbs':'soup',
  'Banana':'fruit','Apple':'fruit','Blueberries':'fruit','Dragonfruit':'fruit','Pear':'fruit','Strawberry':'fruit',
  'Oats':'carbs','Brown Rice':'carbs','Pasta':'carbs','Meesua':'carbs',
};

// ── Generation ────────────────────────────────────────────────────────────────
function findRec(type,name){ return (REC[type]||[]).find(r=>r.name===name); }
function makeDish(type,name){ const r=findRec(type,name); return {type,name,ing:r?r.ing:[]}; }

function rnd(arr,excl=[]){
  const a=arr.filter(x=>!excl.includes(x));
  return (a.length?a:arr)[Math.floor(Math.random()*(a.length||arr.length))];
}
function weightedVeg(excl=[]){
  const pool=[];
  REC.veg.forEach(r=>{
    if(!excl.includes(r.name)){
      const w=r.name.toLowerCase().includes('brocoli')?4:1;
      for(let i=0;i<w;i++) pool.push(r.name);
    }
  });
  const src=pool.length?pool:REC.veg.map(r=>r.name);
  return src[Math.floor(Math.random()*src.length)];
}

function generateWeek(){
  const fruits=[...REC.fruit].sort(()=>Math.random()-.5);
  const [f1,f2,f3]=fruits;
  const fruitByDay={Monday:f1,Tuesday:f2,Wednesday:f1,Thursday:f3,Friday:f2,Saturday:f3,Sunday:f3};

  const usedVeg={}, usedProt=[], usedSoup=[];

  function nv(ex=[]){
    const over=Object.entries(usedVeg)
      .filter(([n,c])=>n.toLowerCase().includes('brocoli')?c>=4:c>=2).map(([n])=>n);
    const name=weightedVeg([...over,...ex]);
    usedVeg[name]=(usedVeg[name]||0)+1;
    return makeDish('veg',name);
  }
  function np(ex=[]){
    const n=rnd(REC.protein.map(r=>r.name),[...usedProt,...ex]);
    usedProt.push(n); if(usedProt.length>3) usedProt.shift();
    return makeDish('protein',n);
  }
  function ns(pool,ex=[]){
    const src=(pool||REC.soup).map(r=>typeof r==='string'?r:r.name);
    const n=rnd(src,[...usedSoup,...ex]);
    usedSoup.push(n); if(usedSoup.length>2) usedSoup.shift();
    return makeDish('soup',n);
  }
  function bf(day){
    const f=fruitByDay[day];
    const fd=makeDish('fruit',f.name);
    if(IS_WE[day]) return [{...makeDish('carbs','Oats'),ing:['Oats',f.name]},fd];
    return [fd];
  }

  const porkSoups=REC.soup.filter(r=>r.ing.includes('Pork Ribs'));
  const p={};
  DAYS.forEach(d=>{p[d]={out:{Breakfast:false,Lunch:false,Dinner:false},Breakfast:bf(d),Lunch:[],Dinner:[]};});

  p.Monday.Lunch  = [makeDish('protein','Chicken Breast'), nv()];
  p.Monday.Dinner = [makeDish('soup','Dun Ji Tang'), makeDish('protein','Tofu Minced Pork'), nv()];
  p.Tuesday.Lunch  = [np(['Salmon egg']), nv(), ns(porkSoups,['Dun Ji Tang'])];
  p.Tuesday.Dinner = [makeDish('protein','Salmon egg'), nv()];
  p.Wednesday.Lunch  = [np(), nv()];
  p.Wednesday.Dinner = [ns(porkSoups), np(), nv()];
  ['Thursday','Friday','Saturday','Sunday'].forEach(d=>{
    const lp=np(), lv=nv();
    p[d].Lunch  = [lp, lv];
    p[d].Dinner = [ns(), np([lp.name]), nv()];
  });
  return p;
}

// ── API connection ──────────────────────────────────────────────────────────
// When hosted on Railway, API_BASE is empty (same server).
// When HTML is on Vercel and Flask is on Railway, set this to your Railway URL:
//   const API_BASE = 'web-production-2794a.up.railway.app';
const API_BASE = 'https://web-production-2794a.up.railway.app';

let plan = generateWeek(); // fallback until API loads
let weekOffset = 0;
let editCtx = {day:null, meal:null, idx:null};
let shareUrl = '';
let selectedType = 'protein';

// ── Render ────────────────────────────────────────────────────────────────────
function getWeekDates(){
  const d=new Date();
  d.setDate(d.getDate()-((d.getDay()+6)%7)+weekOffset*7);
  return DAYS.map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x;});
}

function changeWeek(dir){ weekOffset+=dir; render(); }

function dishLabel(d){
  const r=findRec(d.type,d.name);
  const ings=(r?r.ing:d.ing)||[];
  return {name:d.name, ing:ings.length?ings.join(' + '):''};
}

function render(){
  const dates=getWeekDates();
  const first=dates[0].toLocaleDateString('en-SG',{month:'short',day:'numeric'});
  const last=dates[6].toLocaleDateString('en-SG',{month:'short',day:'numeric'});
  document.getElementById('week-label').textContent=first+' – '+last;

  const tbody=document.getElementById('plan-body');
  tbody.innerHTML='';

  DAYS.forEach((day,di)=>{
    const data=plan[day];
    const dt=dates[di];
    const dateStr=dt.toLocaleDateString('en-SG',{day:'numeric',month:'short'});
    const tr=document.createElement('tr');

    // Day cell
    let dayHtml=`<td class="td-day">
      <div class="day-name">${day}</div>
      <div class="day-date">${dateStr}</div>
      ${IS_WE[day]?'<span class="wknd-badge">Weekend</span>':''}
    </td>`;

    // Meal cells
    ['Breakfast','Lunch','Dinner'].forEach(meal=>{
      const isOut=data.out[meal];
      const dishes=data[meal]||[];
      let html=`<td class="td-meal">
        <div class="meal-head">
          <span class="meal-lbl">${meal}</span>
          <button class="out-toggle ${isOut?'active':''}" onclick="toggleOut('${day}','${meal}')">${isOut?'✓ Out':'Out?'}</button>
        </div>`;
      if(isOut){
        html+=`<div class="out-state">🍽 Dining out</div>`;
      } else {
        dishes.forEach((d,i)=>{
          const{name,ing}=dishLabel(d);
          html+=`<div class="dish" onclick="openEdit('${day}','${meal}',${i})">
            <span class="dish-dot ${TYPE_DOT[d.type]||'veg-dot'}"></span>
            <div class="dish-info">
              <div class="dish-name">${name}</div>
              ${ing?`<div class="dish-ing">${ing}</div>`:''}
            </div>
            <span class="dish-edit-icon">✎</span>
          </div>`;
        });
        html+=`<button class="add-btn" onclick="openAdd('${day}','${meal}')">+ Add dish</button>`;
      }
      html+=`</td>`;
      dayHtml+=html;
    });

    tr.innerHTML=dayHtml;
    tbody.appendChild(tr);
  });
  renderMobile();
}

// ── Toggle out ────────────────────────────────────────────────────────────────
function toggleOut(day,meal){
  plan[day].out[meal]=!plan[day].out[meal];
  render();
  savePlanToAPI();
}

// ── Regenerate ────────────────────────────────────────────────────────────────
async function regenerate(){
  try {
    const res = await fetch(API_BASE + '/api/regenerate', {method:'POST'});
    const data = await res.json();
    if(data.ok){ plan=data.plan; render(); }
  } catch(e){
    // Fallback to local generation if API unreachable
    plan=generateWeek(); render();
  }
}

// ── Edit modal ────────────────────────────────────────────────────────────────
function openEdit(day,meal,idx){
  editCtx={day,meal,idx};
  const d=plan[day][meal][idx];
  document.getElementById('dish-modal-title').textContent='Edit dish';
  document.getElementById('m-day').innerHTML=DAYS.map(x=>`<option ${x===day?'selected':''}>${x}</option>`).join('');
  document.getElementById('m-meal').value=meal;
  selectType(d.type);
  syncRecipeList(d.type);
  document.getElementById('m-recipe').value='';
  const r=findRec(d.type,d.name);
  document.getElementById('m-name').value=r&&r.ing.length?d.name+' — '+r.ing.join(' + '):d.name;
  document.getElementById('ing-hint').style.display='none';
  document.getElementById('delete-btn').style.display='inline-flex';
  document.getElementById('dish-overlay').classList.add('open');
}

function openAdd(day,meal){
  editCtx={day,meal,idx:null};
  document.getElementById('dish-modal-title').textContent='Add dish';
  document.getElementById('m-day').innerHTML=DAYS.map(x=>`<option ${x===day?'selected':''}>${x}</option>`).join('');
  document.getElementById('m-meal').value=meal;
  const defaultType=meal==='Breakfast'?'fruit':'protein';
  selectType(defaultType);
  syncRecipeList(defaultType);
  document.getElementById('m-name').value='';
  document.getElementById('ing-hint').style.display='none';
  document.getElementById('delete-btn').style.display='none';
  document.getElementById('dish-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('m-name').focus(),100);
}

function selectType(type){
  selectedType=type;
  document.getElementById('m-type').value=type;
  document.querySelectorAll('.type-badge').forEach(b=>{
    b.classList.toggle('selected', b.classList.contains(type));
  });
  syncRecipeList(type);
}

function onMealChange(){
  if(document.getElementById('m-meal').value==='Breakfast') selectType('fruit');
}

function syncRecipeList(type){
  const t=type||selectedType;
  const el=document.getElementById('m-recipe');
  el.innerHTML='<option value="">— select a recipe or type custom below —</option>'+
    (REC[t]||[]).map(r=>`<option>${r.name}</option>`).join('');
  document.getElementById('ing-hint').style.display='none';
}

function onRecipePick(){
  const name=document.getElementById('m-recipe').value;
  if(!name){document.getElementById('ing-hint').style.display='none';return;}
  const r=findRec(selectedType,name);
  if(r){
    document.getElementById('m-name').value=r.ing.length?r.name+' — '+r.ing.join(' + '):r.name;
    document.getElementById('ing-hint').innerHTML='<strong>Ingredients:</strong> '+r.ing.join(', ');
    document.getElementById('ing-hint').style.display='block';
  }
}

async function savePlanToAPI(){
  try {
    await fetch(API_BASE + '/api/plan', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({plan})
    });
  } catch(e){
    console.warn('Could not save to API — working offline', e);
  }
}

function saveDish(){
  const day=document.getElementById('m-day').value;
  const meal=document.getElementById('m-meal').value;
  const type=selectedType;
  const raw=document.getElementById('m-name').value.trim();
  if(!raw){document.getElementById('m-name').focus();return;}
  const sep=raw.indexOf(' — ');
  const name=sep>-1?raw.slice(0,sep).trim():raw;
  const r=findRec(type,name);
  const dish={type,name,ing:r?r.ing:[]};
  const{day:od,meal:om,idx}=editCtx;
  if(idx===null){
    plan[day][meal].push(dish);
  } else {
    if(day!==od||meal!==om){
      plan[od][om].splice(idx,1);
      plan[day][meal].push(dish);
    } else {
      plan[day][meal][idx]=dish;
    }
  }
  closeOverlay('dish-overlay');
  render();
  savePlanToAPI();
}

function deleteDish(){
  const{day,meal,idx}=editCtx;
  if(idx!==null) plan[day][meal].splice(idx,1);
  closeOverlay('dish-overlay');
  render();
  savePlanToAPI();
}

function closeOverlay(id){document.getElementById(id).classList.remove('open');}

// ── Grocery ───────────────────────────────────────────────────────────────────
function buildGrocery(){
  function collect(days){
    const s=new Set();
    days.forEach(day=>['Breakfast','Lunch','Dinner'].forEach(meal=>{
      if(plan[day].out[meal])return;
      (plan[day][meal]||[]).forEach(d=>(d.ing&&d.ing.length?d.ing:[d.name]).forEach(i=>i&&s.add(i)));
    }));
    return [...s].sort();
  }
  return{mon:collect(['Monday','Tuesday','Wednesday']),thu:collect(['Thursday','Friday','Saturday','Sunday'])};
}

function showGrocery(){
  const{mon,thu}=buildGrocery();
  function renderItems(items){
    if(!items.length) return`<div class="groc-empty">No items (all dining out)</div>`;
    return items.map(name=>{
      const cat=ING_CAT[name]||'veg';
      return`<div class="groc-item"><span class="groc-dot" style="background:${DOT_COLOR[cat]}"></span>${name}</div>`;
    }).join('');
  }
  document.getElementById('groc-cols').innerHTML=`
    <div class="groc-section">
      <h4>🛒 Monday shop <span style="font-size:10px;font-weight:400;color:var(--text3)">Mon – Wed</span></h4>
      ${renderItems(mon)}
    </div>
    <div class="groc-section">
      <h4>🛒 Thursday shop <span style="font-size:10px;font-weight:400;color:var(--text3)">Thu – Sun</span></h4>
      ${renderItems(thu)}
    </div>`;
  document.getElementById('groc-overlay').classList.add('open');
}

function grocText(){
  const{mon,thu}=buildGrocery();
  const wk=document.getElementById('week-label').textContent;
  return`🛒 *Grocery List — ${wk}*\n\n*Monday shop (Mon–Wed):*\n`+mon.map(i=>`• ${i}`).join('\n')+
    `\n\n*Thursday shop (Thu–Sun):*\n`+thu.map(i=>`• ${i}`).join('\n')+'\n\n_Family Meal Planner_';
}
function sendGrocery(p){
  closeOverlay('groc-overlay');
  const url=p==='telegram'?'https://t.me/share/url?url=&text='+encodeURIComponent(grocText()):
    'https://wa.me/?text='+encodeURIComponent(grocText());
  window.open(url,'_blank');
}

// ── Share ─────────────────────────────────────────────────────────────────────
function buildMealText(){
  const wk=document.getElementById('week-label').textContent;
  const ME={Breakfast:'🌅',Lunch:'☀️',Dinner:'🌙'};
  let lines=[`🍱 *Meal Plan — ${wk}*\n`];
  DAYS.forEach(day=>{
    const data=plan[day];
    lines.push(`\n*${day}*`);
    ['Breakfast','Lunch','Dinner'].forEach(meal=>{
      if(data.out[meal]){lines.push(`  ${ME[meal]} _${meal}_: dining out`);return;}
      if(!(data[meal]||[]).length)return;
      lines.push(`  ${ME[meal]} _${meal}_`);
      data[meal].forEach(d=>{
        const{name,ing}=dishLabel(d);
        lines.push(`  • ${name}${ing?' — '+ing:''}`);
      });
    });
  });
  lines.push('\n\n_Family Meal Planner_');
  return lines.join('\n');
}

function shareVia(platform){
  const text=buildMealText();
  document.getElementById('share-text').value=text;
  if(platform==='telegram'){
    document.getElementById('share-title').textContent='Send via Telegram';
    document.getElementById('share-hint').textContent='Tap "Open Telegram" — the message is pre-filled, choose your family or helper group and send.';
    shareUrl='https://t.me/share/url?url=&text='+encodeURIComponent(text);
    const b=document.getElementById('share-open-btn');b.className='btn btn-tg';b.textContent='Open Telegram ↗';
  } else {
    document.getElementById('share-title').textContent='Send via WhatsApp';
    document.getElementById('share-hint').textContent='Tap "Open WhatsApp" — the meal plan is ready to send to your family or helper group.';
    shareUrl='https://wa.me/?text='+encodeURIComponent(text);
    const b=document.getElementById('share-open-btn');b.className='btn btn-wa';b.textContent='Open WhatsApp ↗';
  }
  document.getElementById('share-overlay').classList.add('open');
}
function doShare(){if(shareUrl)window.open(shareUrl,'_blank');}

// ── Mobile render ─────────────────────────────────────────────────────────────
function renderMobile(){
  const dates=getWeekDates();
  const mp=document.getElementById('mobile-plan');
  if(!mp) return;
  mp.innerHTML='';
  const ME={Breakfast:'🌅 Breakfast',Lunch:'☀️ Lunch',Dinner:'🌙 Dinner'};
  DAYS.forEach((day,di)=>{
    const data=plan[day];
    const dt=dates[di];
    const dateStr=dt.toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short'});
    let html=`<div class="day-card">
      <div class="day-card-header">
        <div class="day-card-left">
          <div>
            <div class="day-card-name">${day}</div>
            <div class="day-card-date">${dateStr}</div>
          </div>
          ${IS_WE[day]?'<span class="wknd-badge">Weekend</span>':''}
        </div>
      </div>`;
    ['Breakfast','Lunch','Dinner'].forEach(meal=>{
      const isOut=data.out[meal];
      const dishes=data[meal]||[];
      html+=`<div class="meal-block">
        <div class="meal-block-head">
          <span class="meal-block-label">${ME[meal]}</span>
          <button class="out-toggle ${isOut?'active':''}" onclick="toggleOut('${day}','${meal}')">${isOut?'✓ Out':'Out?'}</button>
        </div>`;
      if(isOut){
        html+=`<div class="out-state">🍽 Dining out</div>`;
      } else {
        dishes.forEach((d,i)=>{
          const{name,ing}=dishLabel(d);
          html+=`<div class="dish" onclick="openEdit('${day}','${meal}',${i})">
            <span class="dish-dot ${TYPE_DOT[d.type]||'veg-dot'}"></span>
            <div class="dish-info">
              <div class="dish-name">${name}</div>
              ${ing?`<div class="dish-ing">${ing}</div>`:''}
            </div>
            <span class="dish-edit-icon">✎</span>
          </div>`;
        });
        html+=`<button class="add-btn" onclick="openAdd('${day}','${meal}')">+ Add dish</button>`;
      }
      html+=`</div>`;
    });
    html+=`</div>`;
    mp.innerHTML+=html;
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('m-name').addEventListener('keydown',e=>{if(e.key==='Enter')saveDish();});
document.querySelectorAll('.overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');});
});

// Load plan from Flask API on startup
async function init(){
  try {
    const res  = await fetch(API_BASE + '/api/plan');
    const data = await res.json();
    if(data.ok){
      plan = data.plan;
      if(data.week) document.getElementById('week-label').textContent = data.week;
    }
  } catch(e){
    console.warn('API not reachable — using local generated plan', e);
  }
  render();
}

init();
</script>
